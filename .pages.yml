# Pages CMS – Redaktionskonfiguration für den GHSE-Prototyp
# Feldnamen entsprechen exakt den Front-Matter-Schlüsseln der Hugo-Templates.
#
# media:  wo Uploads landen und welcher öffentliche Pfad in Inhalte geschrieben wird
#         Bilder  -> static/bilder   -> /bilder/...   (Templates: <img src="{{ .Params.bild }}">)
#         Dokumente -> assets/downloads -> /downloads/... (Templates: resources.Get + RelPermalink)

media:
  - name: images
    label: Bilder
    input: static/bilder
    output: /bilder
    extensions: [png, jpg, jpeg, webp]
    rename: safe
  - name: documents
    label: Dokumente
    input: assets/downloads
    output: /downloads
    categories: [document]
    rename: false

content:
  - name: startseite
    label: Startseite
    type: file
    path: content/_index.md
    fields:
      - name: titel
        label: Überschrift (Hero)
        type: string
      - name: untertitel
        label: Unterzeile
        type: text
      - name: description
        label: Meta-Beschreibung
        type: text
      - name: bild
        label: Hero-Bild
        type: image
        options:
          media: images
      - name: bildAlt
        label: Bildbeschreibung (Alt-Text)
        type: string

      # Abschnitt „Termine“: öffentliche Kalender pro Schulart
      - name: termine_text
        label: Termine – Einleitung
        type: text

      # „Nächster Termin“ als Ticket unter dem Hero-Button. Bewusst leer, bis
      # die GHSE einen Termin liefert – erfundene Daten sind tabu. Die Vorlage
      # rendert das Ticket nur, wenn alle drei Pflichtfelder gefüllt sind.
      - name: naechster_termin
        label: Nächster Termin (Hero-Ticket, optional)
        type: object
        fields:
          - name: titel
            label: Bezeichnung (z. B. Tag der offenen Tür)
            type: string
          - name: datum
            label: Datum
            type: date
            options:
              format: yyyy-MM-dd
          - name: ort
            label: Ort (optional)
            type: string
          - name: url
            label: Ziel (Link)
            type: string

      # Listen aus Objekten: type: object + list: + fields: (Plural). Eine
      # Form `type: list` mit `field:` wird vom Editor nicht als Liste
      # erkannt und als Textfeld gerendert – im Feld stand dann
      # „[object Object]“. Die Zusammenfassung lebt unter list.collapsible
      # und schreibt ihre Platzhalter mit einfachen Klammern.
      - name: termine
        label: Terminkalender
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Bezeichnung (z. B. Berufsschule)
            type: string
          - name: url
            label: Link zum Kalender
            type: string

      # Abschnitt „Berufs- und Studieninformation“
      - name: berufsinfo
        label: Berufs- und Studieninformation
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{titel} ({datum})"
        fields:
          - name: titel
            label: Titel
            type: string
          - name: datum
            label: Datum (Anzeige)
            # Wird unverändert ausgegeben, nicht als Datumsfeld formatiert.
            description: Erscheint unverändert auf der Karte – Format TT.MM.JJJJ.
            pattern:
              regex: '^\d{2}\.\d{2}\.\d{4}$'
              message: "Bitte TT.MM.JJJJ verwenden, z. B. 22.04.2024"
            type: string
          - name: teaser
            label: Anrisstext
            type: text
          - name: url
            label: Link zum Beitrag
            type: string
      - name: berufsinfo_mehr
        label: Link „Noch mehr Infos“
        type: string

      # Abschnitt „Die GHSE bei Instagram“
      - name: insta_text
        label: Instagram – Einleitung
        type: text
      - name: insta_beitraege
        label: Instagram-Beiträge (4 Kacheln)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{text}"
        fields:
          - name: bild
            label: Beitragbild
            type: image
            options:
              media: images
          - name: bildAlt
            label: Bildbeschreibung (Alt-Text)
            type: string
          - name: text
            label: Bildunterschrift (Kurzfassung)
            type: text
          - name: url
            label: Link zum Beitrag
            type: string
      - name: insta_kanaele
        label: Weitere Instagram-Accounts
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "@{name}"
        fields:
          - name: name
            label: Account-Name
            type: string
          - name: beschreibung
            label: Beschreibung
            type: string
          - name: url
            label: Link
            type: string

      # Abschnitt „Schüler/innen – Schulleben – Lehrer/innen“
      - name: schulleben_text
        label: Schulleben – Einleitung
        type: text
      - name: schulleben_url
        label: Link „Jetzt erkunden“
        type: string
      - name: schulleben_bilder
        label: Bilderreihe (3 Bilder)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{bildAlt}"
        fields:
          - name: bild
            label: Bild
            type: image
            options:
              media: images
          - name: bildAlt
            label: Bildbeschreibung (Alt-Text)
            type: string

      # Abschnitt „Partner“
      - name: partner_logos
        label: Partnerlogos (einzelne Kacheln)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{bildAlt}"
        fields:
          - name: bild
            label: Logo
            type: image
            options:
              media: images
          - name: bildAlt
            label: Bildbeschreibung (Alt-Text)
            type: string

  # Zusätzlich in der Vorlage gerendert, aber bewusst kein CMS-Feld:
  # "downloads" (Slugs verwandter Dokumente, nur beim Technischen
  # Gymnasium gesetzt) – steckt in content/schularten/technisches-gymnasium.md.
  - name: schularten
    label: Schularten (Inhaltsseiten)
    type: collection
    path: content/schularten
    fields:
      - name: title
        label: Titel
        type: string
      - name: description
        label: Meta-Beschreibung
        type: text
      - name: kategorie
        label: Schulart-Gruppe
        type: select
        options:
          values: [Vollzeitschularten, Teilzeitschularten]
      - name: kurz
        label: Kurzbeschreibung (Karte/Teaser)
        type: text
      - name: abschluss
        label: Abschluss / Ziel
        type: string
      - name: bild
        label: Bild
        type: image
        options:
          media: images
      - name: bildAlt
        label: Bildbeschreibung (Alt-Text)
        type: string
      # downloads (Liste der Schlagwörter aus der Sammlung „downloads“) ist
      # bewusst kein Feld hier: Die Syntax für Listen aus reinen Strings ist
      # nicht belegt – ein geratenes Feld lieferte der Redaktion ein
      # kaputtes Textfeld.
      - name: weight
        label: Reihenfolge
        type: number
      - name: body
        label: Inhalt
        type: rich-text

  - name: news
    label: Aktuelles
    type: collection
    path: content/news
    fields:
      - name: title
        label: Überschrift
        type: string
      - name: date
        label: Datum
        type: date
        options:
          format: yyyy-MM-dd
      - name: quelle
        label: Quelle (Medium)
        type: string
      - name: quelle_url
        label: Link zum Originalartikel
        type: string
      - name: teaser
        label: Teaser
        type: text
      - name: bild
        label: Bild / Artikelabbildung
        type: image
        options:
          media: images
      - name: bildAlt
        label: Bildbeschreibung (Alt-Text)
        type: string
      - name: bild2
        label: Zweite Abbildung (optional)
        type: image
        options:
          media: images
      - name: bild2Alt
        label: Bildbeschreibung 2 (optional)
        type: string
      - name: bild3
        label: Dritte Abbildung (optional)
        type: image
        options:
          media: images
      - name: bild3Alt
        label: Bildbeschreibung 3 (optional)
        type: string
      - name: body
        label: Nachrichtentext (optional)
        type: rich-text

  # Einzelne Inhaltsseite ohne eigene Sammlung. Layout: _default/single.html
  # (h1, description als Lead, body). Künftige Seiten derselben Art
  # (Anfahrt, Leitbild, Beratung …) bekommen jeweils ein eigenes file-Feld
  # mit demselben Feldsatz – ein Layout trägt sie alle.
  - name: die_ghse
    label: Die GHSE (Inhaltsseite)
    type: file
    path: content/die-ghse.md
    fields:
      - name: title
        label: Titel
        type: string
      - name: description
        label: Meta-Beschreibung
        type: text
      - name: body
        label: Inhalt
        type: rich-text

  # Gleicher Feldsatz wie die_ghse: dieselbe Vorlage rendert beide.
  - name: unsere_schule
    label: Unsere Schule (Inhaltsseite)
    type: file
    path: content/unsere-schule.md
    fields:
      - name: title
        label: Titel
        type: string
      - name: description
        label: Meta-Beschreibung
        type: text
      # Porträts der Schulleitung, gerendert über {{< portraets >}} an der
      # Stelle im Text, wo der Shortcode steht. Ohne Alt-Text, weil Funktion
      # und Name als Bildunterschrift danebenstehen – das Bild ist dann
      # informationstechnisch entbehrlich.
      - name: portraets
        label: Porträts der Schulleitung
        type: list
        fields:
          - name: bild
            label: Porträt
            type: image
            options:
              media: images
          - name: funktion
            label: Funktion (z. B. Schulleiter)
            type: string
          - name: name
            label: Name
            type: string
      - name: body
        label: Inhalt
        type: rich-text

  # Startseiten-CTAs zeigen auf diese beiden Seiten (berufsinfo_mehr und
  # schulleben_url in content/_index.md) – daher hier als eigene Einträge.
  - name: berufsinformation
    label: Berufsinformation (Inhaltsseite)
    type: file
    path: content/berufsinformation.md
    fields:
      - name: title
        label: Titel
        type: string
      - name: description
        label: Meta-Beschreibung
        type: text
      - name: body
        label: Inhalt
        type: rich-text

  - name: schulleben
    label: Schulleben (Inhaltsseite)
    type: file
    path: content/schulleben.md
    fields:
      - name: title
        label: Titel
        type: string
      - name: description
        label: Meta-Beschreibung
        type: text
      - name: body
        label: Inhalt
        type: rich-text

  # Vier Schulseiten, die derzeit nur über den Fuß erreichbar sind.
  # Gleicher Feldsatz wie die_ghse – eine Vorlage bedient alle.
  - name: foerderverein
    label: Förderverein (Inhaltsseite)
    type: file
    path: content/foerderverein.md
    fields:
      - name: title
        label: Titel
        type: string
      - name: description
        label: Meta-Beschreibung
        type: text
      - name: body
        label: Inhalt
        type: rich-text

  - name: unesco
    label: UNESCO-Projektschule (Inhaltsseite)
    type: file
    path: content/unesco.md
    fields:
      - name: title
        label: Titel
        type: string
      - name: description
        label: Meta-Beschreibung
        type: text
      - name: body
        label: Inhalt
        type: rich-text

  - name: mint
    label: MINT-freundliche Schule (Inhaltsseite)
    type: file
    path: content/mint.md
    fields:
      - name: title
        label: Titel
        type: string
      - name: description
        label: Meta-Beschreibung
        type: text
      - name: body
        label: Inhalt
        type: rich-text

  - name: schulsozialarbeit
    label: Schulsozialarbeit (Inhaltsseite)
    type: file
    path: content/schulsozialarbeit.md
    fields:
      - name: title
        label: Titel
        type: string
      - name: description
        label: Meta-Beschreibung
        type: text
      - name: body
        label: Inhalt
        type: rich-text

  # Bewerbungsverfahren: die Schularten TG und 2BF verweisen auf diese Seite.
  - name: bewo
    label: Bewerbung online / BewO (Inhaltsseite)
    type: file
    path: content/bewo.md
    fields:
      - name: title
        label: Titel
        type: string
      - name: description
        label: Meta-Beschreibung
        type: text
      - name: body
        label: Inhalt
        type: rich-text

  - name: praktikum_fuer_studierende
    label: Praktikum für Lehramtsstudierende (Inhaltsseite)
    type: file
    path: content/praktikum-fuer-studierende.md
    fields:
      - name: title
        label: Titel
        type: string
      - name: description
        label: Meta-Beschreibung
        type: text
      - name: body
        label: Inhalt
        type: rich-text

  # Der Einstiegstext der Download-Seite wird von downloads/section.html als
  # .Content gerendert und liegt in _index.md. Bewusst ein eigenes file-Feld
  # statt body in der Sammlung: dort tragen 16 der 17 Dateien render: never,
  # ihr Text würde nie erscheinen – ein totes Feld pro Eintrag.
  - name: downloads_einstieg
    label: Downloads – Einstieg
    type: file
    path: content/downloads/_index.md
    fields:
      - name: title
        label: Überschrift
        type: string
      - name: description
        label: Meta-Beschreibung
        type: text
      - name: body
        label: Einleitung (Fließtext)
        type: rich-text

  - name: downloads
    label: Downloads
    type: collection
    path: content/downloads
    fields:
      - name: title
        label: Dokumenttitel
        type: string
      - name: beschreibung
        label: Beschreibung
        type: text
      - name: kategorie
        label: Kategorie
        type: select
        options:
          values:
            - Flyer & Schularten
            - Termine & Blockpläne
            - Oberstufe & Abitur
            - Formulare & Hausordnung
      - name: datei
        label: Datei (PDF)
        type: file
        options:
          media: documents
      - name: weight
        label: Reihenfolge
        type: number
