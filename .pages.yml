# Pages CMS – Redaktionskonfiguration für den GHSE-Prototyp
# Feldnamen entsprechen exakt den Front-Matter-Schlüsseln der Hugo-Templates.
#
# media:  wo Uploads landen und welcher öffentliche Pfad in Inhalte geschrieben wird
#         Bilder  -> static/bilder   -> /bilder/...   (Templates: <img src="{{ .Params.bild }}">)
#         Dokumente -> assets/downloads -> /downloads/... (Templates: resources.Get + RelPermalink)

media:
  - name: images
    label: Bilder
    input: static/bilder
    output: /bilder
    extensions: [png, jpg, jpeg, webp]
    rename: safe
  - name: documents
    label: Dokumente
    input: assets/downloads
    output: /downloads
    categories: [document]
    rename: false

content:
  - name: startseite
    label: Startseite
    type: file
    path: content/_index.md
    fields:
      - name: titel
        label: Überschrift (Hero)
        type: string
      - name: untertitel
        label: Unterzeile
        type: text
      - name: description
        label: Meta-Beschreibung
        type: text
      - name: bild
        label: Hero-Bild
        type: image
        options:
          media: images
      - name: bildAlt
        label: Bildbeschreibung (Alt-Text)
        type: string

      # Abschnitt „Termine“: öffentliche Kalender pro Schulart
      - name: termine_text
        label: Termine – Einleitung
        type: text

      # „Nächster Termin“ als Ticket unter dem Hero-Button. Bewusst leer, bis
      # die GHSE einen Termin liefert – erfundene Daten sind tabu. Die Vorlage
      # rendert das Ticket nur, wenn alle drei Pflichtfelder gefüllt sind.
      - name: naechster_termin
        label: Nächster Termin (Hero-Ticket, optional)
        type: object
        fields:
          - name: titel
            label: Bezeichnung (z. B. Tag der offenen Tür)
            type: string
          - name: datum
            label: Datum
            type: date
            options:
              format: yyyy-MM-dd
          - name: ort
            label: Ort (optional)
            type: string
          - name: url
            label: Ziel (Link)
            type: string

      # Listen aus Objekten: type: object + list: + fields: (Plural). Eine
      # Form `type: list` mit `field:` wird vom Editor nicht als Liste
      # erkannt und als Textfeld gerendert – im Feld stand dann
      # „[object Object]“. Die Zusammenfassung lebt unter list.collapsible
      # und schreibt ihre Platzhalter mit einfachen Klammern.
      - name: termine
        label: Terminkalender
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Bezeichnung (z. B. Berufsschule)
            type: string
          - name: url
            label: Link zum Kalender
            type: string

      # Abschnitt „Berufs- und Studieninformation“
      - name: berufsinfo
        label: Berufs- und Studieninformation
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{titel} ({datum})"
        fields:
          - name: titel
            label: Titel
            type: string
          - name: datum
            label: Datum (Anzeige)
            # Wird unverändert ausgegeben, nicht als Datumsfeld formatiert.
            description: Erscheint unverändert auf der Karte – Format TT.MM.JJJJ.
            pattern:
              regex: '^\d{2}\.\d{2}\.\d{4}$'
              message: "Bitte TT.MM.JJJJ verwenden, z. B. 22.04.2024"
            type: string
          - name: teaser
            label: Anrisstext
            type: text
          - name: url
            label: Link zum Beitrag
            type: string
      - name: berufsinfo_mehr
        label: Link „Noch mehr Infos“
        type: string

      # Abschnitt „Die GHSE bei Instagram“
      - name: insta_text
        label: Instagram – Einleitung
        type: text
      - name: insta_beitraege
        label: Instagram-Beiträge (4 Kacheln)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{text}"
        fields:
          - name: bild
            label: Beitragbild
            type: image
            options:
              media: images
          - name: bildAlt
            label: Bildbeschreibung (Alt-Text)
            type: string
          - name: text
            label: Bildunterschrift (Kurzfassung)
            type: text
          - name: url
            label: Link zum Beitrag
            type: string
      - name: insta_kanaele
        label: Weitere Instagram-Accounts
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "@{name}"
        fields:
          - name: name
            label: Account-Name
            type: string
          - name: beschreibung
            label: Beschreibung
            type: string
          - name: url
            label: Link
            type: string

      # Abschnitt „Schüler/innen – Schulleben – Lehrer/innen“
      - name: schulleben_text
        label: Schulleben – Einleitung
        type: text
      - name: schulleben_url
        label: Link „Jetzt erkunden“
        type: string
      - name: schulleben_bilder
        label: Bilderreihe (3 Bilder)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{bildAlt}"
        fields:
          - name: bild
            label: Bild
            type: image
            options:
              media: images
          - name: bildAlt
            label: Bildbeschreibung (Alt-Text)
            type: string

      # Abschnitt „Partner“
      - name: partner_logos
        label: Partnerlogos (einzelne Kacheln)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{bildAlt}"
        fields:
          - name: bild
            label: Logo
            type: image
            options:
              media: images
          - name: bildAlt
            label: Bildbeschreibung (Alt-Text)
            type: string

  # Zusätzlich in der Vorlage gerendert, aber bewusst kein CMS-Feld:
  # "downloads" (Slugs verwandter Dokumente, nur beim Technischen
  # Gymnasium gesetzt) – steckt in content/schularten/technisches-gymnasium.md.
  - name: schularten
    label: Schularten (Inhaltsseiten)
    type: collection
    path: content/schularten
    fields:
      - name: title
        label: Titel
        type: string
      - name: description
        label: Meta-Beschreibung
        type: text
      - name: kategorie
        label: Schulart-Gruppe
        type: select
        options:
          values: [Vollzeitschularten, Teilzeitschularten]
      - name: kurz
        label: Kurzbeschreibung (Karte/Teaser)
        type: text
      - name: abschluss
        label: Abschluss / Ziel
        type: string
      - name: bild
        label: Bild
        type: image
        options:
          media: images
      - name: bildAlt
        label: Bildbeschreibung (Alt-Text)
        type: string
      - name: extern
        label: Originalseite (wenn kein Detailinhalt)
        type: string
      - name: weight
        label: Reihenfolge
        type: number
      - name: body
        label: Inhalt
        type: rich-text

  - name: news
    label: Aktuelles
    type: collection
    path: content/news
    fields:
      - name: title
        label: Überschrift
        type: string
      - name: date
        label: Datum
        type: date
        options:
          format: yyyy-MM-dd
      - name: quelle
        label: Quelle (Medium)
        type: string
      - name: quelle_url
        label: Link zum Originalartikel
        type: string
      - name: teaser
        label: Teaser
        type: text
      - name: bild
        label: Bild / Artikelabbildung
        type: image
        options:
          media: images
      - name: bildAlt
        label: Bildbeschreibung (Alt-Text)
        type: string
      - name: bild2
        label: Zweite Abbildung (optional)
        type: image
        options:
          media: images
      - name: bild2Alt
        label: Bildbeschreibung 2 (optional)
        type: string
      - name: bild3
        label: Dritte Abbildung (optional)
        type: image
        options:
          media: images
      - name: bild3Alt
        label: Bildbeschreibung 3 (optional)
        type: string
      - name: body
        label: Nachrichtentext (optional)
        type: rich-text

  # Der Einstiegstext der Download-Seite wird von downloads/section.html als
  # .Content gerendert und liegt in _index.md. Bewusst ein eigenes file-Feld
  # statt body in der Sammlung: dort tragen 16 der 17 Dateien render: never,
  # ihr Text würde nie erscheinen – ein totes Feld pro Eintrag.
  - name: downloads_einstieg
    label: Downloads – Einstieg
    type: file
    path: content/downloads/_index.md
    fields:
      - name: title
        label: Überschrift
        type: string
      - name: description
        label: Meta-Beschreibung
        type: text
      - name: body
        label: Einleitung (Fließtext)
        type: rich-text

  - name: downloads
    label: Downloads
    type: collection
    path: content/downloads
    fields:
      - name: title
        label: Dokumenttitel
        type: string
      - name: beschreibung
        label: Beschreibung
        type: text
      - name: kategorie
        label: Kategorie
        type: select
        options:
          values:
            - Flyer & Schularten
            - Termine & Blockpläne
            - Oberstufe & Abitur
            - Formulare & Hausordnung
      - name: datei
        label: Datei (PDF)
        type: file
        options:
          media: documents
      - name: weight
        label: Reihenfolge
        type: number
