name: Qualitäts-Metriken

# Misst wöchentlich (und auf Abruf) die drei Kennzahlen aus METRIKEN.md
# gegen die Live-Seite und schreibt sie zurück ins Repository:
#   GL  Google Lighthouse-Durchschnitt der vier Kategorien
#   YL  Yellow Lab Tools Gesamtscore (Public API, max. 12 Läufe/24 h)
#   MO  MDN/Mozilla Observatory (CLI, weil deren API keine Unterpfade kennt)
# Der Commit trägt [skip ci], damit kein Deploy-Loop entsteht.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 1"  # montags 04:30 UTC

permissions:
  contents: write

env:
  SEITE: https://maximilianhertenstein.github.io/ghse_website_prototyp/

jobs:
  messen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Google Lighthouse gegen die Live-Seite
        run: |
          npm install --global lighthouse
          lighthouse "$SEITE" --output=json --output-path=lighthouse.json --quiet \
            --chrome-flags="--headless=new --no-sandbox --disable-gpu"

      - name: MDN Observatory (CLI, mit Unterpfad)
        run: |
          HOSTPFAD="${SEITE#https://}"
          npx --yes @mdn/mdn-http-observatory "$HOSTPFAD" > observatory.json

      - name: Metriken erheben und METRIKEN.md schreiben
        run: |
          python3 tools/metriken.py \
            --lighthouse lighthouse.json \
            --observatory observatory.json \
            --url "$SEITE"

      - name: Messberichte als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: messberichte
          path: |
            lighthouse.json
            observatory.json

      - name: METRIKEN.md ins Repository schreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add METRIKEN.md
          if git diff --cached --quiet; then
            echo "Keine Änderung."
          else
            git commit -m "Metriken aktualisiert [skip ci]"
            git push
          fi
