<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }} – {{ site.Params.schulname }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Description | default site.Params.beschreibung }}">
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ .Description | default site.Params.beschreibung }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  {{ with .Params.bild }}<meta property="og:image" content="{{ . | strings.TrimPrefix "/" | absURL }}">{{ end }}
  <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
  <link rel="preload" href="{{ "fonts/inter-var-latin.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
</head>
<body>
  <a class="sprungmarke" href="#inhalt">Direkt zum Inhalt</a>
  {{ partial "header.html" . }}
  <main id="inhalt">
    {{ block "inhalt" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script src="{{ "js/nav.js" | relURL }}" defer></script>
</body>
</html>
