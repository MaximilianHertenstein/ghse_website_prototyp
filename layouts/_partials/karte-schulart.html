<article class="karte">
  <a class="karte__link" href="{{ .RelPermalink }}">
    <figure class="karte__bild">
      {{ with imageConfig (printf "static/%s" (strings.TrimPrefix "/" .Params.bild)) }}
      <img src="{{ $.Params.bild | strings.TrimPrefix "/" | relURL }}" alt="{{ $.Params.bildAlt }}" width="{{ .Width }}" height="{{ .Height }}" loading="lazy">
      {{ end }}
    </figure>
    <div class="karte__koerper">
      {{- /* Farbcode der Gruppe: Vollzeit gelb, Teilzeit orange. */}}
      <p class="marke" data-kategorie="{{ .Params.kategorie | lower }}">{{ .Params.kategorie }}</p>
      <h3 class="karte__titel">{{ .Title }}</h3>
      <p class="karte__text">{{ .Params.kurz }}</p>
      <span class="karte__aktion">Mehr erfahren <span aria-hidden="true">→</span></span>
    </div>
  </a>
</article>
