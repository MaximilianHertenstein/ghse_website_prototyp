# "/" genügt: die Vorlagen bauen alle Pfade mit relURL/relPermalink, die
# GitHub-Actions-Pipeline überschreibt baseURL mit der echten Seitenadresse.
baseURL = "/"
locale = "de-DE"
defaultContentLanguage = "de"
title = "GHSE Emmendingen"

[languages.de]
  label = "Deutsch"
  weight = 1
hasCJKLanguage = false
enableGitInfo = false

# Ablöse des Originals: keine Pagination, keine Taxonomien nötig.
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "robotsTXT"]

[params]
  schulname = "Gewerbliche und Hauswirtschaftlich-Sozialpflegerische Schulen Emmendingen"
  kurzform = "GHSE Emmendingen"
  beschreibung = "Vom Hauptschulabschluss bis zum Abitur: Berufsschule, Pflege, Gymnasien, Berufskolleg und Berufsfachschulen unter einem Dach."
  strasse = "Jahnstr. 12-14"
  ort = "79312 Emmendingen"
  telefon = "07641 465 100"
  telefonLink = "+497641465100"
  fax = "07641 465 199"
  mail = "poststelle@ghse.de"

# Adressen im Fließtext bleiben Text: Der Originalseite stehen dort die
# Webadressen als Klartext, und ein paar davon zeigen längst ins Leere.
# Links entstehen deshalb nur noch aus ausgeschriebenen Markdown-Zielen,
# qa/extlinkcheck.py prüft genau diese.
[markup.goldmark.extensions]
  linkify = false

